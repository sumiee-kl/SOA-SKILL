name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run unit/integration tests
        run: mvn -B verify

      - name: End-to-end forwarding check
        run: |
          java -jar account-service/target/account-service-1.0.0.jar > account.log 2>&1 &
          java -jar api-gateway/target/api-gateway-1.0.0.jar > gateway.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health >/dev/null && \
            curl -sf http://localhost:8080/actuator/health >/dev/null && break
            sleep 2
          done
          ./scripts/verify.sh http://localhost:8080
          echo "---- account-service log (what the backend received) ----"
          grep "Backend received" account.log
